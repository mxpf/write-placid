version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/site
    schedule: { interval: weekly }
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/studio
    schedule: { interval: weekly }
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/trackinghaus
    schedule: { interval: weekly }
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/drafts-mcp
    schedule: { interval: weekly }
    groups:
      compatible-updates:
        patterns: ["*"]
        update-types: [minor, patch]
